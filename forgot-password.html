<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskNova - Quên Mật Khẩu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #050614;
      background-image: linear-gradient(rgba(5, 6, 20, 0.75), rgba(5, 6, 20, 0.85)), 
                        url('https://i.imgur.com/8Q9Z4X3.gif'); /* GIF Sao băng */
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .galaxy-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }
    .neon-btn {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
    }
    .neon-btn:hover {
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.8);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md galaxy-card p-8 rounded-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-cyan-500 to-indigo-500 flex items-center justify-center text-white text-2xl font-bold mx-auto shadow-lg shadow-cyan-500/30">
        🔑
      </div>
      <h2 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400">
        Khôi Phục Mật Khẩu
      </h2>
      <p class="text-xs text-slate-400">Nhập Email để nhận mã OTP xác minh hệ thống</p>
    </div>

    <!-- BƯỚC 1: NHẬP EMAIL & OTP -->
    <form id="forgotStep1" onsubmit="handleVerifyOTP(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Email Tài Khoản</label>
        <div class="flex gap-2">
          <input type="email" id="resetEmail" required placeholder="nhan@gmail.com" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
          <button type="button" onclick="sendResetOTP()" class="px-3 py-2.5 bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-cyan-500/30 rounded-xl text-xs font-semibold whitespace-nowrap transition">
            Gửi OTP
          </button>
        </div>
      </div>

      <div id="otpInputGroup" class="hidden">
        <label class="block text-xs font-semibold text-slate-300 mb-1">Mã OTP (6 chữ số)</label>
        <input type="text" id="resetOTP" placeholder="Nhập 6 số OTP..." maxlength="6" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 tracking-widest text-center font-bold">
      </div>

      <button type="submit" id="btnVerify" class="w-full py-3 rounded-xl font-bold text-white neon-btn transition opacity-50 cursor-not-allowed" disabled>
        Xác Nhận OTP
      </button>
    </form>

    <!-- BƯỚC 2: TẠO MẬT KHẨU MỚI (ẨN BAN ĐẦU) -->
    <form id="forgotStep2" onsubmit="handleResetPassword(event)" class="space-y-4 hidden">
      <div class="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-xs text-emerald-400 text-center">
        ✔️ OTP chính xác! Vui lòng tạo mật khẩu mới.
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Mật Khẩu Mới</label>
        <input type="password" id="newPassword" required placeholder="••••••••" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Xác Nhận Mật Khẩu Mới</label>
        <input type="password" id="confirmNewPassword" required placeholder="••••••••" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
      </div>
      <button type="submit" class="w-full py-3 rounded-xl font-bold text-white neon-btn transition">
        Cập Nhật Mật Khẩu
      </button>
    </form>

    <div class="text-center pt-2">
      <a href="index.html" class="text-xs text-slate-400 hover:text-cyan-400 transition">
        <i class="fa-solid fa-arrow-left mr-1"></i> Quay lại Đăng nhập
      </a>
    </div>
  </div>

  <script>
    let generatedOTP = null;
    let targetEmail = null;

    function sendResetOTP() {
      const email = document.getElementById('resetEmail').value.trim();
      const users = JSON.parse(localStorage.getItem('tasknova_users') || '[]');
      
      const userExists = users.find(u => u.email === email);
      if (!email || !userExists) {
        alert('❌ Email này chưa được đăng ký trong hệ thống!');
        return;
      }

      targetEmail = email;
      generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
      
      document.getElementById('otpInputGroup').classList.remove('hidden');
      const btnVerify = document.getElementById('btnVerify');
      btnVerify.disabled = false;
      btnVerify.classList.remove('opacity-50', 'cursor-not-allowed');

      alert(`📩 Mã OTP khôi phục mật khẩu cho ${email} là: ${generatedOTP}`);
    }

    function handleVerifyOTP(e) {
      e.preventDefault();
      const inputOTP = document.getElementById('resetOTP').value.trim();

      if (inputOTP === generatedOTP) {
        document.getElementById('forgotStep1').classList.add('hidden');
        document.getElementById('forgotStep2').classList.remove('hidden');
      } else {
        alert('❌ Mã OTP không chính xác! Vui lòng thử lại.');
      }
    }

    function handleResetPassword(e) {
      e.preventDefault();
      const newPass = document.getElementById('newPassword').value;
      const confirmPass = document.getElementById('confirmNewPassword').value;

      if (newPass !== confirmPass) {
        alert('❌ Mật khẩu xác nhận không khớp!');
        return;
      }

      let users = JSON.parse(localStorage.getItem('tasknova_users') || '[]');
      let userIndex = users.findIndex(u => u.email === targetEmail);

      if (userIndex !== -1) {
        users[userIndex].password = newPass;
        localStorage.setItem('tasknova_users', JSON.stringify(users));
        alert('🎉 Đổi mật khẩu thành công! Hãy đăng nhập lại.');
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
