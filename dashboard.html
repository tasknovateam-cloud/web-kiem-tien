<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskNova - Galaxy Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      background-color: #050614;
      /* NỀN GIF SAO BĂNG SIÊU MƯỢT HOÀN TOÀN KHÔNG CÓ YOUTUBE */
      background-image: linear-gradient(rgba(5, 6, 20, 0.75), rgba(5, 6, 20, 0.85)), 
                        url('https://i.imgur.com/8Q9Z4X3.gif');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #loader {
      position: fixed;
      inset: 0;
      background-color: #050614;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .loader-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(56, 189, 248, 0.1);
      border-left-color: #38bdf8;
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .galaxy-card {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }
    .neon-text {
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }
    .neon-btn {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
    }

    .tab-content {
      animation: fadeInSlideUp 0.3s ease forwards;
    }

    @keyframes fadeInSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="flex flex-col md:flex-row relative">

  <div id="loader">
    <div class="loader-spinner mb-4"></div>
    <div class="flex items-center gap-2">
      <span class="text-2xl">🚀</span>
      <h2 class="text-xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400">
        TASKNOVA
      </h2>
    </div>
  </div>

  <!-- Sidebar Menu -->
  <aside class="w-full md:w-64 galaxy-card p-5 flex flex-col justify-between border-r border-slate-800 md:min-h-screen">
    <div>
      <div class="flex items-center gap-3 mb-8">
        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-cyan-500 to-indigo-500 flex items-center justify-center text-white text-xl font-bold shadow-lg shadow-cyan-500/30">
          🚀
        </div>
        <h1 class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400 neon-text">
          TASKNOVA
        </h1>
      </div>

      <nav class="space-y-2">
        <button onclick="switchTab('dashboard')" class="nav-btn active w-full flex items-center gap-3 px-4 py-3 rounded-xl transition text-slate-300 hover:bg-slate-800/60 hover:text-cyan-400">
          <i class="fa-solid fa-chart-pie w-5"></i> Tổng quan
        </button>
        <button onclick="switchTab('tasks')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition text-slate-300 hover:bg-slate-800/60 hover:text-cyan-400">
          <i class="fa-solid fa-list-check w-5"></i> Nhiệm vụ
        </button>
        <button onclick="switchTab('withdraw')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition text-slate-300 hover:bg-slate-800/60 hover:text-cyan-400">
          <i class="fa-solid fa-wallet w-5"></i> Rút tiền
        </button>
        <button onclick="switchTab('history')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition text-slate-300 hover:bg-slate-800/60 hover:text-cyan-400">
          <i class="fa-solid fa-clock-rotate-left w-5"></i> Lịch sử & Chuỗi
        </button>
        <button onclick="switchTab('leaderboard')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition text-slate-300 hover:bg-slate-800/60 hover:text-cyan-400">
          <i class="fa-solid fa-trophy w-5"></i> Bảng xếp hạng
        </button>
      </nav>
    </div>

    <!-- KHU VỰC TÊN & EMAIL NGƯỜI DÙNG (ĐÃ FIX CHÍNH XÁC EMAIL) -->
    <div class="pt-5 border-t border-slate-800/80 flex items-center justify-between">
      <div class="flex items-center gap-3 overflow-hidden">
        <div class="w-9 h-9 rounded-full bg-slate-700 flex-shrink-0 flex items-center justify-center font-bold text-cyan-400" id="userAvatar">U</div>
        <div class="truncate">
          <p class="font-semibold text-sm text-slate-200 truncate" id="userName">Username</p>
          <p class="text-xs text-slate-400 truncate" id="userEmail">email@gmail.com</p>
        </div>
      </div>
      <button onclick="logout()" class="text-slate-400 hover:text-rose-400 transition ml-2 flex-shrink-0" title="Đăng xuất">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 p-6 md:p-10 space-y-8 max-w-7xl">
    <section id="tab-dashboard" class="tab-content space-y-6">
      <div>
        <h2 class="text-3xl font-bold text-slate-100">Chào mừng trở lại, <span id="dashWelcomeUser" class="text-cyan-400">Explorer</span> 👋</h2>
        <p class="text-slate-400 text-sm">Hành trình khám phá dải ngân hà TaskNova của bạn.</p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="galaxy-card p-6 rounded-2xl relative overflow-hidden">
          <p class="text-slate-400 text-sm">Số dư Ví</p>
          <h3 class="text-3xl font-black text-cyan-400 mt-2">0 CRD</h3>
        </div>
        <div class="galaxy-card p-6 rounded-2xl relative overflow-hidden">
          <p class="text-slate-400 text-sm">Chuỗi Hoạt Động</p>
          <h3 class="text-3xl font-black text-orange-400 mt-2">1 Ngày 🔥</h3>
        </div>
      </div>
    </section>
  </main>

  <script>
    // LẤY DỮ LIỆU ĐĂNG NHẬP CHÍNH XÁC
    const username = localStorage.getItem('username') || 'Explorer';
    const email = localStorage.getItem('userEmail') || 'user@gmail.com';

    document.getElementById('userName').innerText = username;
    document.getElementById('dashWelcomeUser').innerText = username;
    document.getElementById('userEmail').innerText = email;
    document.getElementById('userAvatar').innerText = username.charAt(0).toUpperCase();

    window.addEventListener('load', () => {
      const loader = document.getElementById('loader');
      setTimeout(() => {
        if (loader) {
          loader.style.opacity = '0';
          loader.style.visibility = 'hidden';
        }
      }, 400);
    });

    function switchTab(tabName) {
      const allTabs = document.querySelectorAll('.tab-content');
      allTabs.forEach(el => el.classList.add('hidden'));
      const selectedTab = document.getElementById(`tab-${tabName}`);
      if (selectedTab) selectedTab.classList.remove('hidden');
    }

    function logout() {
      localStorage.clear();
      alert('Đã đăng xuất!');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
