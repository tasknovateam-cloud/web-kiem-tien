<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskNova - Xác Nhận Nhiệm Vụ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #050614; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .glass-panel { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(56, 189, 248, 0.15); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full glass-panel rounded-2xl p-6 text-center space-y-6 shadow-2xl border border-slate-800">
    
    <!-- ICON TRẠNG THÁI -->
    <div id="statusIcon" class="w-16 h-16 rounded-full bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center mx-auto text-cyan-400 text-2xl">
      <i class="fa-solid fa-spinner fa-spin"></i>
    </div>

    <!-- TIÊU ĐỀ & THÔNG BÁO -->
    <div>
      <h2 class="text-xl font-bold text-slate-100" id="statusTitle">Đang kiểm tra kết quả...</h2>
      <p class="text-xs text-slate-400 mt-2" id="statusDesc">Hệ thống đang xác minh lượt vượt link từ nhà mạng.</p>
    </div>

    <!-- HỘP THƯỞNG -->
    <div id="rewardBox" class="hidden bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-4">
      <p class="text-xs text-slate-400">Bạn được cộng thành công</p>
      <p class="text-2xl font-bold text-emerald-400 my-1" id="rewardAmount">+220 CRD</p>
      <p class="text-[11px] text-slate-500">Số dư đã được cập nhật vào tài khoản!</p>
    </div>

    <!-- NÚT QUAY VỀ -->
    <a href="tasks.html" class="inline-block w-full bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-rose-500/20">
      <i class="fa-solid fa-arrow-left mr-1"></i> Trở về danh sách nhiệm vụ
    </a>
  </div>

  <script>
    function verifyTaskCompletion() {
      const urlParams = new URLSearchParams(window.location.search);
      // Lấy taskId từ URL nếu có, mặc định là nhiệm vụ LINKTOT Tìm Maps
      const taskId = urlParams.get('task') || 'TASK_LINKTOT_TIM_MAPS';
      
      // Mức thưởng cho từng nhiệm vụ
      const rewardMap = {
        'TASK_LINKTOT_TIM_MAPS': 1000,
        'TASK_LINK4M': 300,
        'TASK_LAYMA': 450,
        'TASK_TAPLAYMA': 200,
      };

      const rewardVal = rewardMap[taskId] || 220;

      // 1. Lấy dữ liệu hiện tại của User từ LocalStorage
      let userProgress = JSON.parse(localStorage.getItem('userProgress') || '{}');
      let currentBalance = parseFloat(localStorage.getItem('balance') || '0');

      // 2. Cập nhật tiến trình & cộng tiền
      userProgress[taskId] = (userProgress[taskId] || 0) + 1;
      currentBalance += rewardVal;

      // 3. Lưu lại vào LocalStorage
      localStorage.setItem('userProgress', JSON.stringify(userProgress));
      localStorage.setItem('balance', currentBalance.toString());

      // 4. Hiển thị thông báo thành công sau 1.2 giây
      setTimeout(() => {
        document.getElementById('statusIcon').className = "w-16 h-16 rounded-full bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center mx-auto text-emerald-400 text-2xl";
        document.getElementById('statusIcon').innerHTML = '<i class="fa-solid fa-circle-check"></i>';
        document.getElementById('statusTitle').innerText = "Xác Nhận Thành Công!";
        document.getElementById('statusTitle').className = "text-xl font-bold text-emerald-400";
        document.getElementById('statusDesc').innerText = "Cảm ơn bạn đã hoàn thành nhiệm vụ vượt link.";
        document.getElementById('rewardAmount').innerText = `+${rewardVal} CRD`;
        document.getElementById('rewardBox').classList.remove('hidden');
      }, 1200);
    }

    verifyTaskCompletion();
  </script>
</body>
</html>
