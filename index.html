<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskNova - Kiếm Tiền Online</title>
    <!-- Thư viện Google OAuth SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            color: #cbd5e1;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #38bdf8;
        }

        .btn {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            background-color: #0284c7;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        .btn:hover {
            background-color: #0369a1;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #64748b;
            font-size: 0.85rem;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #334155;
        }

        .divider span {
            padding: 0 10px;
        }

        .google-btn-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .toggle-form {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .toggle-form a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .toggle-form a:hover {
            text-decoration: underline;
        }

        .user-info {
            display: none;
            text-align: center;
        }

        .user-info img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 1rem;
            border: 3px solid #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container" id="auth-box">
        <h1>TaskNova</h1>
        <p class="subtitle">Nền tảng làm nhiệm vụ kiếm tiền</p>

        <!-- Form Đăng ký / Đăng nhập -->
        <form id="auth-form">
            <div class="form-group">
                <label for="username">Tên tài khoản</label>
                <input type="text" id="username" placeholder="Nhập tên tài khoản..." required>
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu..." required>
            </div>
            <button type="submit" class="btn" id="btn-submit">Đăng ký ngay</button>
        </form>

        <div class="divider">
            <span>HOẶC</span>
        </div>

        <!-- Nút Google Sign-In -->
        <div class="google-btn-wrapper">
            <div id="g_id_onload"
                 data-client_id="1092262111091-dafa4j9otpil74ptqbemda4bbn2j9a1i.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse">
            </div>
            <div class="g_id_signin" data-type="standard" data-size="large" data-theme="dark"></div>
        </div>

        <div class="toggle-form">
            <span id="toggle-text">Đã có tài khoản?</span>
            <a id="toggle-btn">Đăng nhập</a>
        </div>
    </div>

    <!-- Màn hình chào mừng khi đăng nhập thành công -->
    <div class="container user-info" id="user-box">
        <img id="user-avatar" src="https://via.placeholder.com/80" alt="Avatar">
        <h2 id="user-name">Xin chào!</h2>
        <p class="subtitle" style="margin-bottom: 1.5rem;">Bạn đã đăng nhập thành công vào TaskNova.</p>
        <button class="btn" style="background-color: #ef4444;" onclick="logout()">Đăng xuất</button>
    </div>

    <script>
        let isLoginMode = false;

        const authForm = document.getElementById('auth-form');
        const btnSubmit = document.getElementById('btn-submit');
        const toggleText = document.getElementById('toggle-text');
        const toggleBtn = document.getElementById('toggle-btn');
        const authBox = document.getElementById('auth-box');
        const userBox = document.getElementById('user-box');

        // Chuyển đổi giữa Đăng ký và Đăng nhập
        toggleBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                btnSubmit.textContent = 'Đăng nhập';
                toggleText.textContent = 'Chưa có tài khoản?';
                toggleBtn.textContent = 'Đăng ký ngay';
            } else {
                btnSubmit.textContent = 'Đăng ký ngay';
                toggleText.textContent = 'Đã có tài khoản?';
                toggleBtn.textContent = 'Đăng nhập';
            }
        });

        // Xử lý Form thường
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const endpoint = isLoginMode ? '/api/login' : '/api/register';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    alert(data.message);
                    if (isLoginMode) {
                        showUserDashboard(data.user);
                    } else {
                        // Tự chuyển sang form Đăng nhập sau khi Đăng ký
                        toggleBtn.click();
                    }
                } else {
                    alert(data.error);
                }
            } catch (err) {
                alert('Lỗi kết nối máy chủ!');
            }
        });

        // Xử lý Google Sign-In
        async function handleCredentialResponse(response) {
            try {
                const res = await fetch('/api/google-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: response.credential })
                });
                const data = await res.json();

                if (res.ok) {
                    alert(data.message);
                    showUserDashboard(data.user);
                } else {
                    alert(data.error);
                }
            } catch (err) {
                alert('Lỗi kết nối máy chủ Google!');
            }
        }

        // Hiện Dashboard đơn giản
        function showUserDashboard(user) {
            authBox.style.display = 'none';
            userBox.style.display = 'block';
            document.getElementById('user-name').textContent = 'Xin chào, ' + user.name + '!';
            if (user.avatar) {
                document.getElementById('user-avatar').src = user.avatar;
            }
        }

        // Đăng xuất
        function logout() {
            userBox.style.display = 'none';
            authBox.style.display = 'block';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }
    </script>
</body>
</html>
