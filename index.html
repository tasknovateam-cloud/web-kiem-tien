<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskNova - Kiếm Tiền Online</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 480px;
      width: 100%;
      border: 1px solid #334155;
    }
    h1 { color: #38bdf8; margin-bottom: 8px; font-size: 2rem; }
    p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 1.5rem; }
    .google-btn-wrapper {
      display: flex;
      justify-content: center;
      margin-top: 1rem;
    }
    
    /* Dashboard & Tasks */
    .dashboard { display: none; text-align: left; }
    .user-profile { display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem; }
    .avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #38bdf8; }
    .user-info h3 { font-size: 1.1rem; color: #f8fafc; }
    .user-info p { font-size: 0.8rem; margin-bottom: 0; }
    
    .balance-box {
      background: #0f172a;
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      border: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .balance-title { color: #94a3b8; font-size: 0.85rem; }
    .balance-amount { color: #38bdf8; font-size: 1.5rem; font-weight: bold; }
    
    .section-title { font-size: 1.1rem; color: #f8fafc; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; }
    
    .task-list { display: flex; flex-direction: column; gap: 10px; }
    .task-item {
      background: #0f172a;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .task-info h4 { font-size: 0.95rem; color: #e2e8f0; }
    .task-reward { color: #4ade80; font-size: 0.85rem; font-weight: bold; margin-top: 2px; }
    .task-btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      transition: 0.2s;
    }
    .task-btn:hover { background: #0369a1; }
    
    .logout-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      margin-top: 1.5rem;
      width: 100%;
      transition: 0.2s;
    }
    .logout-btn:hover { background: #dc2626; }
  </style>
</head>
<body>

  <div class="card">
    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen">
      <h1>TaskNova</h1>
      <p>Nền tảng làm nhiệm vụ kiếm CRD uy tín.</p>
      
      <div class="google-btn-wrapper">
        <div id="g_id_onload"
          data-client_id="1092262111091-dafa4j9otpil74ptqbemda4bbn2j9a1i.apps.googleusercontent.com"
          data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_blue" data-text="sign_in_with"></div>
      </div>
    </div>

    <!-- MÀN HÌNH DASHBOARD -->
    <div id="dashboard-screen" class="dashboard">
      <div class="user-profile">
        <img id="user-avatar" class="avatar" src="" alt="Avatar">
        <div class="user-info">
          <h3 id="user-name">---</h3>
          <p id="user-email">---</p>
        </div>
      </div>

      <div class="balance-box">
        <div class="balance-title">Ví của bạn</div>
        <div id="user-balance" class="balance-amount">0 CRD</div>
      </div>

      <div class="section-title">
        <span>Nhiệm vụ có sẵn</span>
      </div>

      <div class="task-list">
        <div class="task-item">
          <div class="task-info">
            <h4>Xem bài viết 15s</h4>
            <div class="task-reward">+100 CRD</div>
          </div>
          <button class="task-btn" onclick="alert('Tính năng duyệt nhiệm vụ sẽ cập nhật tiếp theo!')">Thực hiện</button>
        </div>
        <div class="task-item">
          <div class="task-info">
            <h4>Like trang Fanpage</h4>
            <div class="task-reward">+250 CRD</div>
          </div>
          <button class="task-btn" onclick="alert('Tính năng duyệt nhiệm vụ sẽ cập nhật tiếp theo!')">Thực hiện</button>
        </div>
      </div>

      <button class="logout-btn" onclick="logout()">Đăng xuất</button>
    </div>
  </div>

  <script>
    window.onload = function() {
      const savedUser = localStorage.getItem('tasknova_user');
      if (savedUser) {
        showDashboard(JSON.parse(savedUser));
      }
    };

    async function handleCredentialResponse(response) {
      try {
        const res = await fetch('/api/google-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: response.credential })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('tasknova_token', data.token);
          localStorage.setItem('tasknova_user', JSON.stringify(data.user));
          showDashboard(data.user);
        } else {
          alert('Đăng nhập thất bại: ' + data.error);
        }
      } catch (err) {
        console.error(err);
        alert('Đã có lỗi xảy ra kết nối với máy chủ!');
      }
    }

    function showDashboard(user) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard-screen').style.display = 'block';
      
      document.getElementById('user-avatar').src = user.avatar || 'https://via.placeholder.com/50';
      document.getElementById('user-name').innerText = user.name;
      document.getElementById('user-email').innerText = user.email;
      // Hiển thị đơn vị CRD
      document.getElementById('user-balance').innerText = (user.balance || 0).toLocaleString('en-US') + ' CRD';
    }

    function logout() {
      localStorage.removeItem('tasknova_token');
      localStorage.removeItem('tasknova_user');
      location.reload();
    }
  </script>
</body>
</html>
