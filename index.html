<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskNova - Kiếm Tiền Online</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 400px;
      width: 90%;
      border: 1px solid #334155;
    }
    h1 { color: #38bdf8; margin-bottom: 8px; font-size: 2rem; }
    p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 2rem; }
    .google-btn-wrapper {
      display: flex;
      justify-content: center;
      margin-top: 1rem;
    }
    /* Dashboard view sau khi đăng nhập */
    .dashboard { display: none; text-align: center; }
    .avatar { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #38bdf8; margin-bottom: 1rem; }
    .balance-box {
      background: #0f172a;
      padding: 1rem;
      border-radius: 10px;
      margin: 1.5rem 0;
      border: 1px solid #334155;
    }
    .balance-title { color: #94a3b8; font-size: 0.85rem; }
    .balance-amount { color: #4ade80; font-size: 1.8rem; font-weight: bold; margin-top: 4px; }
    .logout-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    .logout-btn:hover { background: #dc2626; }
  </style>
</head>
<body>

  <div class="card">
    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen">
      <h1>TaskNova</h1>
      <p>Nền tảng làm nhiệm vụ kiếm tiền online an toàn & uy tín.</p>
      
      <div class="google-btn-wrapper">
        <div id="g_id_onload"
          data-client_id="1092262111091-dafa4j9otpil74ptqbemda4bbn2j9a1i.apps.googleusercontent.com"
          data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_blue" data-text="sign_in_with"></div>
      </div>
    </div>

    <!-- MÀN HÌNH DASHBOARD SAU KHI ĐĂNG NHẬP -->
    <div id="dashboard-screen" class="dashboard">
      <img id="user-avatar" class="avatar" src="" alt="Avatar">
      <h2 id="user-name">---</h2>
      <p id="user-email">---</p>

      <div class="balance-box">
        <div class="balance-title">Số dư tài khoản</div>
        <div id="user-balance" class="balance-amount">0 VNĐ</div>
      </div>

      <button class="logout-btn" onclick="logout()">Đăng xuất</button>
    </div>
  </div>

  <script>
    // Kiểm tra nếu đã đăng nhập trước đó
    window.onload = function() {
      const savedUser = localStorage.getItem('tasknova_user');
      if (savedUser) {
        showDashboard(JSON.parse(savedUser));
      }
    };

    // Xử lý response sau khi bấm Google Login
    async function handleCredentialResponse(response) {
      try {
        const res = await fetch('/api/google-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: response.credential })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('tasknova_token', data.token);
          localStorage.setItem('tasknova_user', JSON.stringify(data.user));
          showDashboard(data.user);
        } else {
          alert('Đăng nhập thất bại: ' + data.error);
        }
      } catch (err) {
        console.error(err);
        alert('Đã có lỗi xảy ra kết nối với máy chủ!');
      }
    }

    // Hiển thị giao diện Dashboard
    function showDashboard(user) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard-screen').style.display = 'block';
      
      document.getElementById('user-avatar').src = user.avatar || 'https://via.placeholder.com/80';
      document.getElementById('user-name').innerText = user.name;
      document.getElementById('user-email').innerText = user.email;
      document.getElementById('user-balance').innerText = (user.balance || 0).toLocaleString('vi-VN') + ' VNĐ';
    }

    // Đăng xuất
    function logout() {
      localStorage.removeItem('tasknova_token');
      localStorage.removeItem('tasknova_user');
      location.reload();
    }
  </script>
</body>
</html>
