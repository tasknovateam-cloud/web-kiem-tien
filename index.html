<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskNova - Portal Đăng Nhập</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background-color: #050614;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
    }

    .galaxy-card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      animation: cardEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardEntrance {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .form-transition {
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .form-hidden {
      opacity: 0;
      transform: translateX(-15px);
      pointer-events: none;
      position: absolute;
      width: 100%;
    }
    .form-visible {
      opacity: 1;
      transform: translateX(0);
      position: relative;
      width: 100%;
    }

    .neon-btn {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
      transition: all 0.3s ease;
    }
    .neon-btn:hover {
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.8);
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

  <div class="w-full max-w-md galaxy-card p-8 rounded-2xl space-y-6 relative z-10">
    <div class="text-center space-y-2">
      <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-cyan-500 to-indigo-500 flex items-center justify-center text-white text-3xl font-bold mx-auto shadow-lg shadow-cyan-500/30 animate-pulse">
        🚀
      </div>
      <h1 class="text-3xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400">
        TASKNOVA
      </h1>
      <p class="text-xs text-slate-400">Cổng kết nối dải ngân hà nhiệm vụ</p>
    </div>

    <!-- TAB SWITCHER -->
    <div class="flex bg-slate-900/80 p-1 rounded-xl border border-slate-800 relative">
      <button id="btnTabLogin" type="button" onclick="toggleAuthTab('login')" class="w-1/2 py-2 rounded-lg text-sm font-bold bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 transition-all duration-300">
        Đăng Nhập
      </button>
      <button id="btnTabRegister" type="button" onclick="toggleAuthTab('register')" class="w-1/2 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-slate-200 transition-all duration-300">
        Đăng Ký
      </button>
    </div>

    <div class="relative min-h-[300px]">
      <!-- FORM ĐĂNG NHẬP -->
      <form id="formLogin" onsubmit="handleLogin(event)" class="form-transition form-visible space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Tên Đăng Nhập / Email</label>
          <input type="text" id="loginUser" required placeholder="Nhập username hoặc email..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 transition">
        </div>
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs font-semibold text-slate-300">Mật Khẩu</label>
            <a href="forgot-password.html" class="text-xs text-cyan-400 hover:underline transition">Quên mật khẩu?</a>
          </div>
          <input type="password" id="loginPass" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 transition">
        </div>
        <button type="submit" class="w-full py-3 rounded-xl font-bold text-white neon-btn">
          Vào Portal TaskNova
        </button>
      </form>

      <!-- FORM ĐĂNG KÝ -->
      <form id="formRegister" onsubmit="handleRegister(event)" class="form-transition form-hidden space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Tên Tài Khoản (Username)</label>
          <input type="text" id="regUser" required placeholder="Ví dụ: BLACK" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Gmail Thực Tế Để Nhận OTP</label>
          <div class="flex gap-2">
            <input type="email" id="regEmail" required placeholder="example@gmail.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 transition">
            <button type="button" id="btnSendOtp" onclick="sendRegisterOTPViaBrevo()" class="px-3 py-2.5 bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-cyan-500/30 rounded-xl text-xs font-semibold whitespace-nowrap transition">
              Gửi OTP
            </button>
          </div>
        </div>
        
        <div id="regOtpGroup" class="hidden space-y-1">
          <label class="block text-xs font-semibold text-slate-300">Nhập Mã OTP Từ Gmail</label>
          <input type="text" id="regOtpInput" placeholder="6 số trong Gmail..." maxlength="6" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 text-center font-bold tracking-widest transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Mật Khẩu</label>
          <input type="password" id="regPass" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 transition">
        </div>
        
        <button type="submit" class="w-full py-3 rounded-xl font-bold text-white neon-btn">
          Tạo Tài Khoản
        </button>
      </form>
    </div>
  </div>

  <script>
    // GHÉP KEY BREVO
    const k1 = "xkeysib-8c1f0684e9236f5c1e4af500504d08d2517715321df872f2aff42f44b9f279e6";
    const k2 = "-ty0EeV4swjnMTJY9";
    const BREVO_API_KEY = k1 + k2;

    let currentRegOTP = null;

    function toggleAuthTab(tab) {
      const fLogin = document.getElementById('formLogin');
      const fReg = document.getElementById('formRegister');
      const bLogin = document.getElementById('btnTabLogin');
      const bReg = document.getElementById('btnTabRegister');

      if (tab === 'login') {
        fLogin.className = "form-transition form-visible space-y-4";
        fReg.className = "form-transition form-hidden space-y-4";
        bLogin.className = "w-1/2 py-2 rounded-lg text-sm font-bold bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 transition-all duration-300";
        bReg.className = "w-1/2 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-slate-200 transition-all duration-300";
      } else {
        fReg.className = "form-transition form-visible space-y-4";
        fLogin.className = "form-transition form-hidden space-y-4";
        bReg.className = "w-1/2 py-2 rounded-lg text-sm font-bold bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 transition-all duration-300";
        bLogin.className = "w-1/2 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-slate-200 transition-all duration-300";
      }
    }

    async function sendRegisterOTPViaBrevo() {
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      if (!email || !email.includes('@')) {
        alert('⚠️ Vui lòng nhập địa chỉ Gmail hợp lệ!');
        return;
      }

      const users = JSON.parse(localStorage.getItem('tasknova_users') || '[]');
      if (users.some(u => u.email.toLowerCase() === email)) {
        alert('❌ Gmail này đã được đăng ký! Vui lòng chọn Gmail khác.');
        return;
      }

      const btn = document.getElementById('btnSendOtp');
      btn.innerText = "⏳ Đang gửi...";
      btn.disabled = true;

      currentRegOTP = Math.floor(100000 + Math.random() * 900000).toString();

      try {
        const response = await fetch("https://api.brevo.com/v3/smtp/email", {
          method: "POST",
          headers: {
            "accept": "application/json",
            "api-key": BREVO_API_KEY,
            "content-type": "application/json"
          },
          body: JSON.stringify({
            sender: { name: "TaskNova Security", email: "tasknova.team@gmail.com" },
            to: [{ email: email }],
            subject: "[TaskNova] Mã xác thực OTP Đăng ký Tài khoản",
            htmlContent: `
              <div style="font-family: Arial, sans-serif; padding: 20px; background-color: #050614; color: #ffffff; border-radius: 10px;">
                <h2 style="color: #38bdf8;">🚀 TaskNova Portal</h2>
                <p>Mã OTP đăng ký tài khoản của bạn là:</p>
                <h1 style="font-size: 36px; letter-spacing: 5px; color: #818cf8; background: #0f172a; padding: 10px 20px; display: inline-block; border-radius: 8px;">${currentRegOTP}</h1>
                <p style="color: #94a3b8; font-size: 12px; margin-top: 20px;">Mã này có hiệu lực trong 5 phút.</p>
              </div>
            `
          })
        });

        if (response.ok) {
          alert(`📩 Mã OTP đã được gửi thành công đến Gmail: ${email}\n(Kiểm tra thêm hòm thư Spam nếu không thấy nhé!)`);
          document.getElementById('regOtpGroup').classList.remove('hidden');
          btn.innerText = "Đã gửi";
        } else {
          const errData = await response.json();
          alert(`⚠️ Lỗi gửi mail: ${errData.message || 'Không gửi được'}`);
          btn.innerText = "Gửi lại";
          btn.disabled = false;
        }
      } catch (error) {
        console.error("Lỗi Brevo:", error);
        alert("❌ Lỗi kết nối gửi OTP!");
        btn.innerText = "Gửi lại";
        btn.disabled = false;
      }
    }

    function handleRegister(e) {
      e.preventDefault();
      const rawUser = document.getElementById('regUser').value.trim();
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const inputOTP = document.getElementById('regOtpInput').value.trim();
      const password = document.getElementById('regPass').value;

      if (!currentRegOTP) {
        alert('⚠️ Bạn chưa bấm gửi mã OTP!');
        return;
      }
      if (inputOTP !== currentRegOTP) {
        alert('❌ Mã OTP không chính xác!');
        return;
      }

      let users = JSON.parse(localStorage.getItem('tasknova_users') || '[]');
      if (users.some(u => u.username.toLowerCase() === rawUser.toLowerCase())) {
        alert(`❌ Username "${rawUser}" đã có người đăng ký!`);
        return;
      }

      users.push({ username: rawUser, email, password });
      localStorage.setItem('tasknova_users', JSON.stringify(users));

      localStorage.setItem('username', rawUser);
      localStorage.setItem('userEmail', email);

      alert('🎉 Đăng ký tài khoản thành công!');
      window.location.href = 'dashboard.html';
    }

    function handleLogin(e) {
      e.preventDefault();
      const userOrEmail = document.getElementById('loginUser').value.trim().toLowerCase();
      const pass = document.getElementById('loginPass').value;

      let users = JSON.parse(localStorage.getItem('tasknova_users') || '[]');
      const account = users.find(u => u.username.toLowerCase() === userOrEmail || u.email.toLowerCase() === userOrEmail);

      if (!account) {
        alert('❌ Tài khoản hoặc Gmail chưa tồn tại! Vui lòng đăng ký.');
        return;
      }
      if (account.password !== pass) {
        alert('❌ Mật khẩu không chính xác!');
        return;
      }

      localStorage.setItem('username', account.username);
      localStorage.setItem('userEmail', account.email);
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
