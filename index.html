<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskNova - Đăng nhập & Đăng ký</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      max-width: 420px;
      width: 100%;
      border: 1px solid #334155;
    }
    h1 { color: #38bdf8; margin-bottom: 8px; font-size: 2rem; text-align: center; }
    p.subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; text-align: center; }
    
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: #cbd5e1; }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }
    .form-group input:focus { border-color: #38bdf8; }
    
    .btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: #0284c7;
      color: white;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 0.5rem;
    }
    .btn:hover { background: #0369a1; }
    
    .switch-link {
      margin-top: 1.2rem;
      text-align: center;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .switch-link a { color: #38bdf8; text-decoration: none; font-weight: bold; }
    
    /* Màn hình OTP & Dashboard */
    .hidden { display: none; }
    .dashboard { text-align: left; }
    .balance-box {
      background: #0f172a;
      padding: 1rem;
      border-radius: 12px;
      margin: 1.5rem 0;
      border: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .balance-amount { color: #38bdf8; font-size: 1.5rem; font-weight: bold; }
    .logout-btn { background: #ef4444; }
    .logout-btn:hover { background: #dc2626; }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- FORM ĐĂNG NHẬP -->
    <div id="login-screen">
      <h1>TaskNova</h1>
      <p class="subtitle">Đăng nhập tài khoản của bạn</p>
      
      <div class="form-group">
        <label>Tên đăng nhập</label>
        <input type="text" id="login-username" placeholder="Nhập tên đăng nhập">
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="login-password" placeholder="Nhập mật khẩu">
      </div>
      
      <button class="btn" onclick="handleLogin()">Đăng Nhập</button>
      
      <div class="switch-link">
        Chưa có tài khoản? <a href="#" onclick="showScreen('register-screen')">Đăng ký ngay</a>
      </div>
    </div>

    <!-- FORM ĐĂNG KÝ (NHẬP USERNAME, PASS, GMAIL) -->
    <div id="register-screen" class="hidden">
      <h1>TaskNova</h1>
      <p class="subtitle">Tạo tài khoản mới</p>
      
      <div class="form-group">
        <label>Tên đăng nhập</label>
        <input type="text" id="reg-username" placeholder="Tên đăng nhập">
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="reg-password" placeholder="Mật khẩu">
      </div>
      <div class="form-group">
        <label>Địa chỉ Gmail</label>
        <input type="email" id="reg-email" placeholder="Địa chỉ email thật để nhận OTP">
      </div>
      
      <button class="btn" onclick="handleSendOTP()">Gửi Mã OTP</button>
      
      <div class="switch-link">
        Đã có tài khoản? <a href="#" onclick="showScreen('login-screen')">Đăng nhập</a>
      </div>
    </div>

    <!-- FORM XÁC THỰC OTP -->
    <div id="otp-screen" class="hidden">
      <h1>Xác Thực OTP</h1>
      <p class="subtitle">Mã OTP 6 số đã được gửi tới Gmail của bạn.</p>
      
      <div class="form-group">
        <label>Mã OTP</label>
        <input type="text" id="otp-input" placeholder="Nhập mã 6 chữ số">
      </div>
      
      <button class="btn" onclick="handleVerifyOTP()">Xác Nhận & Tạo Tài Khoản</button>
    </div>

    <!-- DASHBOARD KHI ĐÃ ĐĂNG NHẬP -->
    <div id="dashboard-screen" class="hidden dashboard">
      <h2 id="user-name">Xin chào!</h2>
      <p id="user-email" style="color: #94a3b8; font-size: 0.85rem; margin-top: 4px;"></p>

      <div class="balance-box">
        <span style="color: #94a3b8;">Ví của bạn</span>
        <span id="user-balance" class="balance-amount">0 CRD</span>
      </div>

      <button class="btn logout-btn" onclick="logout()">Đăng xuất</button>
    </div>

  </div>

  <script>
    let tempEmail = '';

    window.onload = function() {
      const savedUser = localStorage.getItem('tasknova_user');
      if (savedUser) {
        showDashboard(JSON.parse(savedUser));
      }
    };

    function showScreen(screenId) {
      ['login-screen', 'register-screen', 'otp-screen', 'dashboard-screen'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(screenId).classList.remove('hidden');
    }

    // 1. Xử lý Đăng Nhập
    async function handleLogin() {
      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('tasknova_token', data.token);
          localStorage.setItem('tasknova_user', JSON.stringify(data.user));
          showDashboard(data.user);
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert('Có lỗi xảy ra khi đăng nhập!');
      }
    }

    // 2. Gửi OTP
    async function handleSendOTP() {
      const username = document.getElementById('reg-username').value;
      const password = document.getElementById('reg-password').value;
      const email = document.getElementById('reg-email').value;

      if (!username || !password || !email) {
        return alert('Vui lòng điền đầy đủ thông tin!');
      }

      tempEmail = email;

      try {
        const res = await fetch('/api/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, email })
        });
        const data = await res.json();

        if (res.ok) {
          alert(data.message);
          showScreen('otp-screen');
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert('Lỗi khi gửi yêu cầu OTP!');
      }
    }

    // 3. Xác nhận OTP
    async function handleVerifyOTP() {
      const otp = document.getElementById('otp-input').value;

      try {
        const res = await fetch('/api/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: tempEmail, otp })
        });
        const data = await res.json();

        if (res.ok) {
          alert('Đăng ký tài khoản thành công!');
          localStorage.setItem('tasknova_token', data.token);
          localStorage.setItem('tasknova_user', JSON.stringify(data.user));
          showDashboard(data.user);
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert('Lỗi khi xác nhận OTP!');
      }
    }

    function showDashboard(user) {
      showScreen('dashboard-screen');
      document.getElementById('user-name').innerText = 'Xin chào, ' + user.name;
      document.getElementById('user-email').innerText = user.email;
      document.getElementById('user-balance').innerText = (user.balance || 0).toLocaleString('en-US') + ' CRD';
    }

    function logout() {
      localStorage.removeItem('tasknova_token');
      localStorage.removeItem('tasknova_user');
      location.reload();
    }
  </script>
</body>
</html>
