<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskNova - Portal Đăng Nhập</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #050614;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .galaxy-card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }
    .neon-btn {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
    }
    .neon-btn:hover {
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.8);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md galaxy-card p-8 rounded-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-cyan-500 to-indigo-500 flex items-center justify-center text-white text-2xl font-bold mx-auto shadow-lg shadow-cyan-500/30">
        🚀
      </div>
      <h1 class="text-3xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400">
        TASKNOVA
      </h1>
      <p class="text-xs text-slate-400">Cổng kết nối dải ngân hà nhiệm vụ</p>
    </div>

    <!-- TAB SWITCHER -->
    <div class="flex bg-slate-900/80 p-1 rounded-xl border border-slate-800">
      <button id="btnTabLogin" type="button" onclick="toggleAuthTab('login')" class="w-1/2 py-2 rounded-lg text-sm font-bold bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 transition">
        Đăng Nhập
      </button>
      <button id="btnTabRegister" type="button" onclick="toggleAuthTab('register')" class="w-1/2 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-slate-200 transition">
        Đăng Ký
      </button>
    </div>

    <!-- FORM ĐĂNG NHẬP -->
    <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Tên Đăng Nhập / Email</label>
        <input type="text" id="loginUser" required placeholder="Nhập username hoặc email..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
      </div>
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-semibold text-slate-300">Mật Khẩu</label>
          <a href="forgot-password.html" class="text-xs text-cyan-400 hover:underline">Quên mật khẩu?</a>
        </div>
        <input type="password" id="loginPass" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
      </div>
      <button type="submit" class="w-full py-3 rounded-xl font-bold text-white neon-btn transition">
        Vào Portal TaskNova
      </button>
    </form>

    <!-- FORM ĐĂNG KÝ -->
    <form id="formRegister" onsubmit="handleRegister(event)" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Tên Tài Khoản (Username)</label>
        <input type="text" id="regUser" required placeholder="Ví dụ: BLACK" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Email</label>
        <div class="flex gap-2">
          <input type="email" id="regEmail" required placeholder="nhan@gmail.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
          <button type="button" onclick="sendRegisterOTP()" class="px-3 py-2.5 bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-cyan-500/30 rounded-xl text-xs font-semibold whitespace-nowrap transition">
            Gửi OTP
          </button>
        </div>
      </div>
      
      <!-- KHU VỰC NHẬP OTP -->
      <div id="regOtpGroup" class="hidden space-y-1">
        <label class="block text-xs font-semibold text-slate-300">Nhập Mã OTP (6 Số)</label>
        <input type="text" id="regOtpInput" placeholder="Nhập mã OTP tại đây..." maxlength="6" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 text-center font-bold tracking-widest">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Mật Khẩu</label>
        <input type="password" id="regPass" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
      </div>
      
      <button type="submit" id="btnRegisterSubmit" class="w-full py-3 rounded-xl font-bold text-white neon-btn transition">
        Tạo Tài Khoản
      </button>
    </form>
  </div>

  <script>
    let currentRegOTP = null;

    function toggleAuthTab(tab) {
      const fLogin = document.getElementById('formLogin');
      const fReg = document.getElementById('formRegister');
      const bLogin = document.getElementById('btnTabLogin');
      const bReg = document.getElementById('btnTabRegister');

      if (tab === 'login') {
        fLogin.classList.remove('hidden');
        fReg.classList.add('hidden');
        bLogin.className = "w-1/2 py-2 rounded-lg text-sm font-bold bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 transition";
        bReg.className = "w-1/2 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-slate-200 transition";
      } else {
        fReg.classList.remove('hidden');
        fLogin.classList.add('hidden');
        bReg.className = "w-1/2 py-2 rounded-lg text-sm font-bold bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 transition";
        bLogin.className = "w-1/2 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-slate-200 transition";
      }
    }

    // GỬI OTP DÙNG ĐĂNG KÝ
    function sendRegisterOTP() {
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      if (!email || !email.includes('@')) {
        alert('⚠️ Vui lòng nhập địa chỉ Email hợp lệ!');
        return;
      }

      const users = JSON.parse(localStorage.getItem('tasknova_users') || '[]');
      
      // KIỂM TRA TRÙNG GMAIL
      if (users.some(u => u.email.toLowerCase() === email)) {
        alert('❌ Gmail này đã được đăng ký trong hệ thống! Vui lòng dùng Gmail khác hoặc Đăng Nhập.');
        return;
      }

      currentRegOTP = Math.floor(100000 + Math.random() * 900000).toString();
      document.getElementById('regOtpGroup').classList.remove('hidden');

      alert(`📩 Mã OTP Đăng ký của bạn là: ${currentRegOTP}`);
    }

    // XỬ LÝ ĐĂNG KÝ
    function handleRegister(e) {
      e.preventDefault();
      
      const rawUser = document.getElementById('regUser').value.trim();
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const inputOTP = document.getElementById('regOtpInput').value.trim();
      const password = document.getElementById('regPass').value;

      // 1. Kiểm tra OTP
      if (!currentRegOTP) {
        alert('⚠️ Vui lòng bấm "Gửi OTP" để lấy mã xác nhận trước!');
        return;
      }
      if (inputOTP !== currentRegOTP) {
        alert('❌ Mã OTP không chính xác! Vui lòng kiểm tra lại.');
        return;
      }

      let users = JSON.parse(localStorage.getItem('tasknova_users') || '[]');

      // 2. Kiểm tra trùng Username KHÔNG phân biệt hoa/thường
      const isUserExist = users.some(u => u.username.toLowerCase() === rawUser.toLowerCase());
      if (isUserExist) {
        alert(`❌ Tên tài khoản "${rawUser}" đã tồn tại (không phân biệt hoa/thường)! Vui lòng chọn tên khác.`);
        return;
      }

      // 3. Kiểm tra lại trùng Gmail lần cuối
      if (users.some(u => u.email.toLowerCase() === email)) {
        alert('❌ Gmail này đã được đăng ký!');
        return;
      }

      // Lưu tài khoản mới
      users.push({ username: rawUser, email: email, password: password });
      localStorage.setItem('tasknova_users', JSON.stringify(users));

      // Đăng nhập tự động
      localStorage.setItem('username', rawUser);
      localStorage.setItem('userEmail', email);

      alert('🎉 Đăng ký thành công!');
      window.location.href = 'dashboard.html';
    }

    // XỬ LÝ ĐĂNG NHẬP
    function handleLogin(e) {
      e.preventDefault();
      const userOrEmail = document.getElementById('loginUser').value.trim().toLowerCase();
      const pass = document.getElementById('loginPass').value;

      let users = JSON.parse(localStorage.getItem('tasknova_users') || '[]');

      // Tìm tài khoản theo username hoặc email (không phân biệt hoa/thường)
      const account = users.find(u => u.username.toLowerCase() === userOrEmail || u.email.toLowerCase() === userOrEmail);

      if (!account) {
        alert('❌ Tài khoản hoặc Gmail chưa tồn tại! Vui lòng đăng ký tài khoản mới.');
        return;
      }

      if (account.password !== pass) {
        alert('❌ Mật khẩu không chính xác!');
        return;
      }

      // Đăng nhập thành công
      localStorage.setItem('username', account.username);
      localStorage.setItem('userEmail', account.email);
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
